<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Article cover">
  <rect width="800" height="420" fill="#1a1714"/>
  <rect x="120" y="210" width="380" height="42" rx="21" fill="#b5654a"/>
  <rect x="360" y="210" width="360" height="42" rx="21" fill="#5f8060" opacity="0.9"/>
  <rect x="360" y="210" width="140" height="42" rx="21" fill="#e0577e"/>
  <g fill="#897f70" font-family="sans-serif" font-size="15">
    <text x="120" y="200">LONDON</text>
    <text x="600" y="200" text-anchor="end">NEW YORK</text>
  </g>
  <text x="120" y="150" fill="#ece3d6" font-family="sans-serif" font-size="30" font-weight="700">The overlap</text>
  <text x="120" y="300" fill="#c3b8a9" font-family="sans-serif" font-size="16">Where the two largest markets trade at once</text>
</svg>
